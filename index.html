<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin History</title>
  <meta name="description"
    content="Professional lightweight candlestick trading chart for BTCUSDT using Binance Kline API and TradingView Lightweight Charts.">

  <!-- Favicon -->
  <link rel="icon" href="https://www.bitcoin.com/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="https://www.bitcoin.com/favicon.ico" type="image/x-icon">

  <!-- Google Fonts & Lightweight Charts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-container">
    <!-- Header Top Bar -->
    <header class="top-bar">
      <!-- Layout Button (Grid Icon for Single vs Dual Split Chart View) -->
      <button class="layout-icon-btn" id="layout-toggle" title="Toggle Dual Split Chart Layout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="12" x2="21" y2="12"></line>
        </svg>
      </button>

      <div class="header-divider"></div>

      <!-- Icon button to toggle Candlestick vs Heikin Ashi -->
      <button class="candle-icon-btn active" id="chart-type-toggle" title="Heikin-Ashi Mode (Click for Candlesticks)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="9" y1="2" x2="9" y2="6"></line>
          <line x1="9" y1="20" x2="9" y2="22"></line>
          <rect x="6" y="6" width="6" height="14" rx="1"></rect>
          <line x1="17" y1="4" x2="17" y2="8"></line>
          <line x1="17" y1="16" x2="17" y2="20"></line>
          <rect x="14" y="8" width="6" height="8" rx="1"></rect>
        </svg>
      </button>

      <div class="header-divider"></div>

      <!-- Timeframe Buttons (1m, 3m, 5m, 15m, 1H) -->
      <div class="timeframe-group" id="timeframe-group">
        <button class="tf-btn" data-tf="1m">1m</button>
        <button class="tf-btn active" data-tf="3m">3m</button>
        <button class="tf-btn" data-tf="5m">5m</button>
        <button class="tf-btn" data-tf="15m">15m</button>
        <button class="tf-btn" data-tf="1h">1H</button>
        <button class="tf-btn" data-tf="4h">4H</button>
      </div>

      <div class="header-divider"></div>

      <!-- Session Checkboxes (Today) -->
      <div class="level-toggles-group session-group">

        <label class="toggle-btn" title="Enable/Disable Today view (05:00 till 20:00 UTC+8)">
          <input type="checkbox" id="toggle-session" hidden>
          <span>Today</span>
        </label>
      </div>

      <div class="header-divider"></div>

      <!-- Stepper Date Controls (< Wed 2026-09-02 >) -->
      <div class="date-controls">
        <div class="date-stepper-container">
          <button class="date-stepper-btn" id="date-prev-day" title="Previous Weekday">&lt;</button>

          <div class="date-box-wrapper" id="date-box-wrapper" title="Click to open calendar">
            <span class="date-dayname-text" id="date-dayname-text">Wed</span>
            <span class="date-display-text" id="date-display-text">2026-09-02</span>
          </div>

          <button class="date-stepper-btn" id="date-next-day" title="Next Weekday">&gt;</button>
        </div>

        <!-- Custom Weekday-Only Calendar Modal -->
        <div id="calendar-modal" class="calendar-modal hidden">
          <div class="cal-header">
            <button id="cal-prev-month" class="cal-nav-btn">&lt;</button>
            <span id="cal-month-year-title" class="cal-title">September 2026</span>
            <button id="cal-next-month" class="cal-nav-btn">&gt;</button>
          </div>
          <div class="cal-weekdays">
            <span class="weekend-col">Su</span>
            <span>Mo</span>
            <span>Tu</span>
            <span>We</span>
            <span>Th</span>
            <span>Fr</span>
            <span class="weekend-col">Sa</span>
          </div>
          <div class="cal-days-grid" id="cal-days-grid">
            <!-- Generated dynamically in JS -->
          </div>
        </div>
      </div>

      <div class="header-divider"></div>

      <!-- Level Toggle Buttons (PDHLM Fibb Extend ExtendFibb 0800-1200 0800-1400) -->
      <div class="level-toggles-group">
        <label class="toggle-btn active" title="Enable/Disable Previous Daily High, Low, and Mid price lines">
          <input type="checkbox" id="toggle-pdhlm" checked hidden>
          <span>PDHLM</span>
        </label>
        <label class="toggle-btn" title="Enable/Disable 25% and 75% price lines">
          <input type="checkbox" id="toggle-25-75" hidden>
          <span>Fibb</span>
        </label>
        <label class="toggle-btn" title="Enable/Disable 125% price lines">
          <input type="checkbox" id="toggle-extend-fibb" hidden>
          <span>125%</span>
        </label>
        <label class="toggle-btn" title="Enable/Disable 150% price lines">
          <input type="checkbox" id="toggle-extend" hidden>
          <span>150%</span>
        </label>
        <label class="toggle-btn" title="Enable/Disable 08:00-12:00 UTC+8 Asia Session High & Low solid red lines">
          <input type="checkbox" id="toggle-asia-8-12" hidden>
          <span>0800-1200</span>
        </label>
        <label class="toggle-btn" title="Enable/Disable 08:00-14:00 UTC+8 Session High & Low solid red lines">
          <input type="checkbox" id="toggle-asia-8-14" hidden>
          <span>0800-1400</span>
        </label>
        <label class="toggle-btn" title="Enable/Disable 15:00-20:00 UTC+8 Session High & Low solid red lines">
          <input type="checkbox" id="toggle-session-15-20" hidden>
          <span>1500-2000</span>
        </label>
        <label class="toggle-btn" title="Enable/Disable 08:00-20:00 UTC+8 Day Session High & Low solid red lines">
          <input type="checkbox" id="toggle-asia-8-20" hidden>
          <span>0800-2000</span>
        </label>
        <label class="toggle-btn" title="Enable/Disable Previous Day 20:00 - Today 04:00 UTC+8 Session High & Low solid green lines">
          <input type="checkbox" id="toggle-session-2000-0400" hidden>
          <span>2000-0400</span>
        </label>
      </div>

    </header>

    <!-- Main Chart Section (Single or Split Dual Chart View) -->
    <main class="chart-section" id="chart-section">
      <!-- Top Chart Panel -->
      <div class="chart-panel" id="panel-top">
        <div id="badge-top" class="chart-badge">BTCUSDT (Binance)</div>
        <div id="chart-container-top" class="chart-container"></div>
        <canvas id="session-canvas-top" class="session-canvas"></canvas>
      </div>

      <!-- Bottom Chart Panel - Hidden in single layout mode -->
      <div class="chart-panel hidden" id="panel-bottom">
        <div id="badge-bottom" class="chart-badge">BTCUSDT (Binance)</div>
        <div id="chart-container-bottom" class="chart-container"></div>
        <canvas id="session-canvas-bottom" class="session-canvas"></canvas>
      </div>

      <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <span>Fetching Binance Klines...</span>
      </div>

      <!-- Floating Timezone Selector at Bottom Right Time Scale -->
      <div class="timezone-select-wrapper">
        <select id="timezone-select" class="chart-timezone-select" title="Select Display Timezone">
          <option value="UTC">UTC</option>
          <option value="UTC+4">UTC+4</option>
          <option value="UTC+8" selected>UTC+8</option>
        </select>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/events.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/priceLines.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/api.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/playback.js"></script>
  <script src="app.js"></script>
</body>

</html>
